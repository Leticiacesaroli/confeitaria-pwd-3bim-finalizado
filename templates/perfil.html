{% extends 'base.html' %}
{% block content %}

<div class="perfil-box">
    <h2>⊰ MEU PERFIL ⊱</h2>
    <form
        action="{{ url_for('perfil') }}"
        method="POST"
        enctype="multipart/form-data">
        <div class="perfil-foto">

            {% if cliente['foto'] %}

                <img
                    src="{{ url_for('foto_perfil', cliente_id=cliente['id']) }}"
                    class="foto-perfil">

            {% else %}
                <div class="foto-sem-perfil">
                    👤
                </div>

            {% endif %}

            <label for="foto" class="botao-foto">
                Escolher nova foto
            </label>
            <input
                type="file"
                id="foto"
                name="foto"
                accept=".png,.jpg,.jpeg,.gif,.webp">

        </div>
        <h3>Informações pessoais</h3>
        <div class="form-group">
            <label>Nome:</label>
            <input
                type="text"
                value="{{ cliente['nome'] }}"
                disabled>

            <small>
                O nome não pode ser alterado.
            </small>
        </div>


        <div class="form-group">
            <label>Email:</label>
            <input
                type="email"
                value="{{ cliente['email'] }}"
                disabled>

            <small>
                O email não pode ser alterado.
            </small>
        </div>

        <div class="form-group">
            <label>Nickname:</label>
            <input
                type="text"
                name="nickname"
                value="{{ cliente['nickname'] or '' }}"
                placeholder="Digite seu nickname">

        </div>
        <div class="form-group">
            <label>Gênero:</label>
            <select name="genero">

                <option
                    value=""
                    {% if not cliente['genero'] %}
                    selected
                    {% endif %}>
                    Prefiro não informar
                </option>

                <option
                    value="Feminino"
                    {% if cliente['genero'] == 'Feminino' %}
                    selected
                    {% endif %}>
                    Feminino
                </option>

                <option
                    value="Masculino"
                    {% if cliente['genero'] == 'Masculino' %}
                    selected
                    {% endif %}>
                    Masculino
                </option>

                <option
                    value="Não-binário"
                    {% if cliente['genero'] == 'Não-binário' %}
                    selected
                    {% endif %}>
                    Não-binário
                </option>
                <option
                    value="Outro"
                    {% if cliente['genero'] == 'Outro' %}
                    selected
                    {% endif %}>
                    Outro
                </option>
            </select>
        </div>

        <h3>Endereço</h3>

        <div class="form-group">
            <label>Rua:</label>
            <input
                type="text"
                name="rua"
                value="{{ cliente['rua'] or '' }}">
        </div>

        <div class="form-group">
            <label>Número:</label>
            <input
                type="text"
                name="numero"
                value="{{ cliente['numero'] or '' }}">

        </div>

        <div class="form-group">
            <label>Bairro:</label>
            <input
                type="text"
                name="bairro"
                value="{{ cliente['bairro'] or '' }}">

        </div>

        <div class="form-group">
            <label>Cidade:</label>
            <input
                type="text"
                name="cidade"
                value="{{ cliente['cidade'] or '' }}">

        </div>

        <div class="form-group">
            <label>Estado:</label>
            <input
                type="text"
                name="estado"
                value="{{ cliente['estado'] or '' }}">
        </div>

        <button type="submit">
            Salvar alterações
        </button>
    </form>
</div>

{% endblock %}
