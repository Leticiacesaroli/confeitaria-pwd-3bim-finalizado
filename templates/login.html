{% extends 'base.html' %}
{% block content %}
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
    
    <div class="auth-box">
        <h2>⊰ LOGIN ⊱</h2>
        <form action="{{ url_for('web_login') }}" method="POST">
            <div class="form-group">
                <label>Tipo de Usuário:</label>
                <select name="tipo_usuario">
                    <option value="1">Cliente</option>
                    <option value="2">Funcionário</option>
                    <option value="3">Administrador</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <div class="auth-box">
        <h2>⊰ CADASTRO ⊱</h2>
        <form action="{{ url_for('web_cadastrar') }}" method="POST">
            <div class="form-group">
                <label>Cadastrar como:</label>
                <select name="tipo_usuario" id="tipo_cad" onchange="toggleEndereco()">
                    <option value="1">Cliente</option>
                    <option value="2">Funcionário</option>
                </select>
            </div>
            <div class="form-group"><label>Nome:</label><input type="text" name="nome" required></div>
            <div class="form-group"><label>Email:</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Senha:</label><input type="password" name="senha" required></div>
            
            <div id="campos-cliente">
                <div class="form-group"><label>Telefone:</label><input type="text" name="telefone"></div>
                <h3>Endereço</h3>
                <div class="form-group"><label>Rua:</label><input type="text" name="rua"></div>
                <div class="form-group"><label>Número:</label><input type="text" name="numero"></div>
                <div class="form-group"><label>Bairro:</label><input type="text" name="bairro"></div>
                <div class="form-group"><label>Cidade:</label><input type="text" name="cidade"></div>
                <div class="form-group"><label>Estado:</label><input type="text" name="estado"></div>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</div>

<script>
function toggleEndereco() {
    var tipo = document.getElementById('tipo_cad').value;
    document.getElementById('campos-cliente').style.display = (tipo === '2') ? 'none' : 'block';
}
</script>
{% endblock %}
